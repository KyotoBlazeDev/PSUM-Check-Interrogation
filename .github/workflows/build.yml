name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  installer:
    name: Build x64 setup
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify unified modes and data safeguards
        run: dotnet run --project Verification/Verification.csproj --configuration Release
      - name: Publish and compile installer
        run: ./scripts/Build-Installer.ps1
      - name: Verify silent install and uninstall
        run: ./scripts/Test-Installer.ps1
      - name: Upload setup and checksum
        uses: actions/upload-artifact@v7
        with:
          name: PSUM-Setup-x64-${{ github.run_number }}
          path: artifacts/installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
